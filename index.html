<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f33"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Gerechten"><link rel="manifest" href="manifest.webmanifest"><title>Mijn Gerechten</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8f8f3;color:#18392e;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}header{background:#173f33;color:white;padding:28px 18px 20px}h1{margin:0 0 7px}main{max-width:780px;margin:auto;padding:16px}input,select,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #cbd6cf}input{width:100%}button{cursor:pointer;background:#173f33;color:white;border:0}nav{display:flex;gap:8px;margin:12px 0}nav button{flex:1}.active{background:#daebdd;color:#173f33}.card{background:white;border:1px solid #e2e9e2;border-radius:15px;margin:10px 0;padding:16px;box-shadow:0 2px 6px #00000008}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#68786d;font-size:13px}.heart{background:#f3f4f0;color:#173f33}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tag{background:#e4eee6;padding:6px 10px;border-radius:20px;font-size:12px}.hidden{display:none}a{color:#176748}textarea{width:100%;min-height:75px}footer{text-align:center;padding:24px;color:#68786d;font-size:12px}</style></head>
<body><header><h1>🍽️ Mijn Gerechten</h1><p>Recepten ontdekken, bewaren en boodschappen plannen</p></header><main>
<nav><button id="tabRecipes" class="active" onclick="tab('recipes')">Recepten</button><button id="tabFavorites" onclick="tab('favorites')">❤️ Favorieten</button><button id="tabShopping" onclick="tab('shopping')">🛒 Lijst</button></nav>
<section id="recipes"><input id="search" placeholder="Zoek een gerecht of ingrediënt…" oninput="render()"><div class="tags"><select id="category" onchange="render()"><option value="">Alle categorieën</option><option>Pasta</option><option>Vegetarisch</option><option>Vis</option><option>Vlees</option><option>Aziatisch</option><option>Overig</option></select><button onclick="showAdd()">+ Recept toevoegen</button></div><div id="addBox" class="card hidden"><h3>Eigen recept of publieke receptenlink toevoegen</h3><input id="newTitle" placeholder="Naam gerecht"><p><input id="newUrl" placeholder="Link naar het originele recept (optioneel)"></p><p><input id="newIngredients" placeholder="Ingrediënten, gescheiden door komma's"></p><button onclick="addRecipe()">Bewaren</button></div><p class="muted" id="count"></p><div id="recipeList"></div></section>
<section id="favorites" class="hidden"><div id="favoriteList"></div></section>
<section id="shopping" class="hidden"><h2>Boodschappenlijst</h2><div class="card"><input id="shoppingInput" placeholder="Voeg een product toe"><p><button onclick="addShopping()">Toevoegen</button></p></div><div id="shoppingList"></div><button onclick="clearChecked()">Verwijder afgevinkte producten</button></section>
</main><footer>Persoonlijk receptenboek · Niet verbonden aan Marley Spoon · Recepten en links zelf aan te vullen</footer>
<script>
const starter=[['Romige pasta met champignons','Pasta'],['Gnocchi met spinazie en tomaat','Vegetarisch'],['Noedels met paksoi en wortel','Aziatisch'],['Risotto met champignons','Vegetarisch'],['Pasta met geroosterde paprika','Pasta'],['Groentecurry met rijst','Aziatisch']];
const key='gerechten-recepten-v1',favKey='gerechten-favs-v1',shopKey='gerechten-shop-v1';
let recipes=JSON.parse(localStorage.getItem(key)||'null')||starter.map((r,i)=>({id:'starter'+i,title:r[0],category:r[1],ingredients:[],url:''}));
let favorites=JSON.parse(localStorage.getItem(favKey)||'[]'),shopping=JSON.parse(localStorage.getItem(shopKey)||'[]');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(recipes));localStorage.setItem(favKey,JSON.stringify(favorites));localStorage.setItem(shopKey,JSON.stringify(shopping))}
function tab(t){['recipes','favorites','shopping'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==t);document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===t)});render()}
function card(r){let liked=favorites.includes(r.id);return '<article class="card"><div class="line"><h3>'+esc(r.title)+'</h3><button class="heart" onclick="toggleFav(\''+r.id+'\')">'+(liked?'❤️':'♡')+'</button></div><span class="tag">'+esc(r.category)+'</span>'+(r.ingredients.length?'<p class="muted">Ingrediënten: '+esc(r.ingredients.join(', '))+'</p>':'<p class="muted">Ingrediënten nog niet toegevoegd</p>')+(r.url?'<p><a target="_blank" rel="noopener noreferrer" href="'+esc(r.url)+'">Bekijk origineel recept</a></p>':'')+'<div class="line"><button onclick="toShopping(\''+r.id+'\')">Ingrediënten op lijst</button><button class="heart" onclick="removeRecipe(\''+r.id+'\')">Verwijder</button></div></article>'}
function render(){let q=document.getElementById('search').value.toLowerCase(),cat=document.getElementById('category').value;let matches=recipes.filter(r=>(r.title+' '+r.ingredients.join(' ')).toLowerCase().includes(q)&&(!cat||r.category===cat));document.getElementById('count').textContent=matches.length+' gerechten';document.getElementById('recipeList').innerHTML=matches.map(card).join('')||'<p>Geen gerechten gevonden.</p>';document.getElementById('favoriteList').innerHTML=recipes.filter(r=>favorites.includes(r.id)).map(card).join('')||'<p>Bewaar gerechten met het hartje.</p>';document.getElementById('shoppingList').innerHTML=shopping.map((s,i)=>'<div class="card line"><label><input type="checkbox" style="width:auto" '+(s.done?'checked':'')+' onchange="checkShopping('+i+')"> '+esc(s.name)+'</label><button class="heart" onclick="shopping.splice('+i+',1);save();render()">✕</button></div>').join('')||'<p>Je boodschappenlijst is leeg.</p>'}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render()}
function showAdd(){document.getElementById('addBox').classList.toggle('hidden')}
function addRecipe(){let title=document.getElementById('newTitle').value.trim(),url=document.getElementById('newUrl').value.trim(),ingredients=document.getElementById('newIngredients').value.split(',').map(x=>x.trim()).filter(Boolean);if(!title)return alert('Vul een naam in');if(url&&!/^https?:\/\//i.test(url))return alert('Gebruik een geldige https-link');recipes.unshift({id:'r'+Date.now(),title,category:'Overig',url,ingredients});save();document.getElementById('newTitle').value='';document.getElementById('newUrl').value='';document.getElementById('newIngredients').value='';showAdd();render()}
function removeRecipe(id){if(confirm('Recept verwijderen?')){recipes=recipes.filter(x=>x.id!==id);save();render()}}
function toShopping(id){let r=recipes.find(x=>x.id===id);if(!r.ingredients.length)return alert('Voeg eerst ingrediënten toe aan dit recept');shopping.push(...r.ingredients.map(name=>({name,done:false})));save();tab('shopping')}
function addShopping(){let el=document.getElementById('shoppingInput');if(el.value.trim()){shopping.push({name:el.value.trim(),done:false});el.value='';save();render()}}
function checkShopping(i){shopping[i].done=!shopping[i].done;save();render()}
function clearChecked(){shopping=shopping.filter(x=>!x.done);save();render()}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
